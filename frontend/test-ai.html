<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test AI - Kiểm Tra API Key</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: #374151;
        }

        .form-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 14px;
            font-family: 'Courier New', monospace;
        }

        .btn {
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 12px;
            display: none;
        }

        .result.success {
            background: #d1fae5;
            border: 2px solid #10b981;
            color: #065f46;
        }

        .result.error {
            background: #fee2e2;
            border: 2px solid #ef4444;
            color: #991b1b;
        }

        .result.loading {
            background: #fef3c7;
            border: 2px solid #f59e0b;
            color: #92400e;
        }

        .response-box {
            background: #f9fafb;
            padding: 20px;
            border-radius: 12px;
            margin-top: 15px;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }

        .icon {
            font-size: 24px;
            margin-right: 10px;
        }

        .debug-info {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #6b7280;
            margin-top: 10px;
        }

        .quick-tests {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }

        .quick-btn {
            padding: 10px 15px;
            background: #f3f4f6;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }

        .quick-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .info-box {
            background: #eff6ff;
            border: 2px solid #3b82f6;
            color: #1e40af;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧪 Test AI Chatbot</h1>
            <p>Kiểm tra xem API key có hoạt động không</p>
        </div>

        <div class="card">
            <div class="info-box">
                <strong>💡 Hướng dẫn:</strong><br>
                Nhập API key của bạn và câu hỏi test. Tool này sẽ gọi trực tiếp Gemini API để kiểm tra.
            </div>

            <div class="form-group">
                <label>🔑 Gemini API Key:</label>
                <input 
                    type="text" 
                    id="apiKey" 
                    placeholder="AIzaSy..." 
                    value="AIzaSyD4WwI7x34t2JWP-OKy9Rwm_2yrsGJKzVM"
                />
                <small style="color: #6b7280;">
                    Lấy key tại: <a href="https://makersuite.google.com/app/apikey" target="_blank">Google AI Studio</a>
                </small>
            </div>

            <div class="form-group">
                <label>💬 Câu hỏi test:</label>
                <input 
                    type="text" 
                    id="testMessage" 
                    placeholder="VD: Có sự kiện Sơn Tùng MTP không?"
                    value="Có sự kiện Sơn Tùng MTP không?"
                />
            </div>

            <button class="btn" onclick="testAI()" id="testBtn">
                🚀 Test AI Ngay
            </button>

            <div class="quick-tests">
                <button class="quick-btn" onclick="quickTest('Xin chào!')">👋 Xin chào</button>
                <button class="quick-btn" onclick="quickTest('EventQR là gì?')">❓ EventQR là gì</button>
                <button class="quick-btn" onclick="quickTest('Làm sao đăng ký?')">📝 Cách đăng ký</button>
                <button class="quick-btn" onclick="quickTest('Tìm sự kiện công nghệ')">🔍 Tìm sự kiện</button>
            </div>

            <div id="result" class="result"></div>
        </div>

        <div class="card">
            <h3 style="margin-bottom: 15px;">📊 Kết Quả Phân Tích</h3>
            <div id="analysis"></div>
        </div>
    </div>

    <script>
        async function testAI() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const message = document.getElementById('testMessage').value.trim();
            const resultDiv = document.getElementById('result');
            const analysisDiv = document.getElementById('analysis');
            const testBtn = document.getElementById('testBtn');

            if (!apiKey) {
                alert('Vui lòng nhập API key!');
                return;
            }

            if (!message) {
                alert('Vui lòng nhập câu hỏi test!');
                return;
            }

            // Show loading
            resultDiv.style.display = 'block';
            resultDiv.className = 'result loading';
            resultDiv.innerHTML = '<span class="icon">⏳</span> Đang gọi Gemini AI... Vui lòng đợi';
            testBtn.disabled = true;

            const startTime = Date.now();

            try {
                const prompt = `Bạn là trợ lý AI thông minh của EventQR - nền tảng quản lý sự kiện.

PERSONALITY:
- Tên: EventBot
- Tính cách: Thân thiện, nhiệt tình, hài hước
- Phong cách: Trả lời ngắn gọn (2-3 câu), súc tích
- Ngôn ngữ: Tiếng Việt tự nhiên
- Emoji: Dùng vừa phải

KIẾN THỨC:
- EventQR là nền tảng quản lý sự kiện tại Việt Nam
- Tính năng: Đăng ký sự kiện, QR check-in, thống kê

QUY TẮC:
- Trả lời thẳng thắn, không dài dòng
- Nếu không biết → nói thật
- Luôn hữu ích và thân thiện

---

Người dùng hỏi: "${message}"

Trả lời (2-3 câu):`;

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: prompt }]
                        }],
                        generationConfig: {
                            temperature: 0.8,
                            topP: 0.95,
                            topK: 40,
                            maxOutputTokens: 250,
                        }
                    })
                });

                const endTime = Date.now();
                const responseTime = endTime - startTime;

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error?.message || 'API Error');
                }

                const aiResponse = data.candidates[0].content.parts[0].text;

                // Show success
                resultDiv.className = 'result success';
                resultDiv.innerHTML = `
                    <div>
                        <span class="icon">✅</span>
                        <strong>API hoạt động tốt!</strong>
                    </div>
                    <div class="response-box">
                        <strong>🤖 AI Response:</strong><br><br>
                        ${aiResponse}
                    </div>
                    <div class="debug-info">
                        Response time: ${responseTime}ms | 
                        Tokens: ~${Math.round(aiResponse.length / 4)} | 
                        Model: gemini-pro
                    </div>
                `;

                // Analysis
                analysisDiv.innerHTML = `
                    <div style="color: #065f46; background: #d1fae5; padding: 15px; border-radius: 8px;">
                        <strong>✅ ĐÁNH GIÁ:</strong><br><br>
                        • API key hợp lệ và hoạt động tốt<br>
                        • Response time: ${responseTime < 2000 ? '⚡ Nhanh' : '🐢 Chậm'} (${responseTime}ms)<br>
                        • Độ dài câu trả lời: ${aiResponse.length < 300 ? '✅ Vừa phải' : '⚠️ Hơi dài'}<br>
                        • Chất lượng: ${analyzeQuality(aiResponse)}<br><br>
                        <strong>📝 KẾT LUẬN:</strong><br>
                        Chatbot của bạn đang dùng AI THẬT và hoạt động tốt! 🎉
                    </div>
                `;

            } catch (error) {
                const endTime = Date.now();
                const responseTime = endTime - startTime;

                resultDiv.className = 'result error';
                resultDiv.innerHTML = `
                    <div>
                        <span class="icon">❌</span>
                        <strong>Lỗi!</strong>
                    </div>
                    <div class="response-box">
                        <strong>Error:</strong> ${error.message}<br><br>
                        <strong>Nguyên nhân có thể:</strong><br>
                        • API key không hợp lệ<br>
                        • API key chưa được kích hoạt (đợi 1-2 phút)<br>
                        • Đã hết quota (60 requests/phút)<br>
                        • Không có kết nối internet
                    </div>
                    <div class="debug-info">
                        Response time: ${responseTime}ms | Status: Error
                    </div>
                `;

                analysisDiv.innerHTML = `
                    <div style="color: #991b1b; background: #fee2e2; padding: 15px; border-radius: 8px;">
                        <strong>❌ ĐÁNH GIÁ:</strong><br><br>
                        • API key có vấn đề hoặc không hợp lệ<br>
                        • Chatbot đang dùng FALLBACK mode (không thông minh)<br><br>
                        <strong>🔧 GIẢI PHÁP:</strong><br>
                        1. Lấy API key mới tại: <a href="https://makersuite.google.com/app/apikey" target="_blank">Google AI Studio</a><br>
                        2. Copy key và paste vào file chatbot.js<br>
                        3. Refresh trang và test lại<br><br>
                        <strong>📞 Hoặc liên hệ hỗ trợ:</strong> +84 762 886 983
                    </div>
                `;
            }

            testBtn.disabled = false;
        }

        function analyzeQuality(response) {
            let score = 0;
            let feedback = [];

            // Check length
            if (response.length > 50 && response.length < 500) {
                score += 2;
            } else {
                feedback.push('Độ dài chưa tối ưu');
            }

            // Check emoji
            if (/[\u{1F300}-\u{1F9FF}]/u.test(response)) {
                score += 1;
            }

            // Check Vietnamese
            if (/[àáảãạâầấẩẫậăằắẳẵặèéẻẽẹêềếểễệìíỉĩịòóỏõọôồốổỗộơờớởỡợùúủũụưừứửữựỳýỷỹỵđ]/i.test(response)) {
                score += 2;
            } else {
                feedback.push('Không có tiếng Việt có dấu');
            }

            // Check natural language
            if (/(bạn|tôi|mình|nhé|nha|được|nào)/i.test(response)) {
                score += 1;
            }

            if (score >= 5) return '⭐⭐⭐⭐⭐ Xuất sắc';
            if (score >= 4) return '⭐⭐⭐⭐ Tốt';
            if (score >= 3) return '⭐⭐⭐ Khá';
            return '⭐⭐ Trung bình - ' + feedback.join(', ');
        }

        function quickTest(message) {
            document.getElementById('testMessage').value = message;
            testAI();
        }

        // Auto-load API key from chatbot.js if exists
        window.addEventListener('load', () => {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey && !document.getElementById('apiKey').value.includes('YOUR_KEY')) {
                document.getElementById('apiKey').value = savedKey;
            }
        });
    </script>
</body>
</html>
