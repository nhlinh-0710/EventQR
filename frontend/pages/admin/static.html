<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thống Kê - EventQR</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../../css/admin/dashboard.css">
    <link rel="stylesheet" href="../../css/placehoders.css">
    <link rel="stylesheet" href="../../css/user/qr-checkin.css">
    <link rel="stylesheet" href="../../css/user/suggest-events.css">
    <link rel="stylesheet" href="../../css/user/my-tickets.css">
    <link rel="stylesheet" href="../../css/user/my-events.css">

</head>

<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <i class="fas fa-calendar-alt"></i>
                <span>EventQR</span>
            </div>
            <button class="sidebar-toggle" id="sidebarToggle">
                <i class="fas fa-bars"></i>
            </button>
        </div>

        <div class="sidebar-menu">
            <a href="index.html" class="menu-link">
                <i class="fas fa-tachometer-alt"></i>
                <span>Dashboard</span>
            </a>
            <a href="events.html" class="menu-link">
                <i class="fas fa-calendar-check"></i>
                <span>Sự Kiện của tôi</span>
            </a>
            <a href="create_event.html" class="menu-link">
                <i class="fas fa-plus-circle"></i>
                <span>Tạo Sự Kiện</span>
            </a>
            <a href="qr.html" class="menu-link">
                <i class="fas fa-qrcode"></i>
                <span>QR Check-in</span>
            </a>
            <a href="attendees.html" class="menu-link">
                <i class="fas fa-users"></i>
                <span>Người Tham Dự</span>
            </a>
            <a href="static.html" class="menu-link active">
                <i class="fas fa-chart-bar"></i>
                <span>Thống Kê</span>
            </a>
            <a href="feedback.html" class="menu-link">
                <i class="fas fa-comments"></i>
                <span>Feedback</span>
            </a>
            <a href="profile.html" class="menu-link">
                <i class="fas fa-user-cog"></i>
                <span>Hồ Sơ</span>
            </a>
        </div>
        <div class="sidebar-footer">
            <button class="logout-btn" onclick="handleLogout()">
                <i class="fas fa-sign-out-alt"></i>
                <span>Đăng Xuất</span>
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <button class="mobile-menu-btn" id="mobileMenuBtn">
                    <i class="fas fa-bars"></i>
                </button>
                <h1 id="pageTitle">Dashboard</h1>
            </div>
            <div class="header-right">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Tìm kiếm sự kiện...">
                </div>
                <div class="notifications">
                    <button class="notification-btn" id="notificationBtn" onclick="toggleNotificationPanel()">
                        <i class="fas fa-bell"></i>
                        <span class="notification-badge" id="notification-badge">0</span>
                    </button>
                    <!-- Notification Panel -->
                    <div class="notification-panel" id="notificationPanel">
                        <div class="notification-header">
                            <h3>Thông báo</h3>
                            <button class="mark-all-read-btn" onclick="markAllNotificationsAsRead()">
                                Đánh dấu tất cả đã đọc
                            </button>
                        </div>
                        <div class="notification-list" id="notificationList">
                            <div class="notification-loading">Đang tải...</div>
                        </div>
                        <div class="notification-footer">
                            <a href="#" onclick="viewAllNotifications()">Xem tất cả</a>
                        </div>
                    </div>
                </div>
                <div class="user-profile">
                    <div class="avatar-placeholder" id="userAvatar">U</div>
                    <span class="user-name" id="userName">Người dùng</span>
                    <i class="fas fa-chevron-down"></i>
                </div>
            </div>
        </header>
        <!-- Analytics Section -->
        <section id="analytics-section" class="content-section active">
            <div class="analytics-card">
                <h2>Thống Kê & Báo Cáo</h2>
                <!-- Bộ lọc từ ngày đến ngày -->
                <div class="date-filter">
                    <label for="startDate">Từ ngày:</label>
                    <input type="date" id="startDate">
                    <label for="endDate">Đến ngày:</label>
                    <input type="date" id="endDate">
                    <button onclick="filterChart()">Lọc</button>
                </div>
                <!-- Biểu đồ -->
                <div class="chart-container">
                    <canvas id="areaChart"></canvas>
                </div>
            </div>
        </section>
    </div>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const ctx = document.getElementById('areaChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['Tháng 1', 'Tháng 2', 'Tháng 3', 'Tháng 4', 'Tháng 5', 'Tháng 6', 'Tháng 7', 'Tháng 8'],
                    datasets: [{
                        label: 'Người tham dự',
                        data: [80, 10, 50, 70, 80, 70, 56, 140,],
                        fill: true,
                        backgroundColor: 'rgba(54, 162, 235, 0.3)',
                        borderColor: 'rgba(54, 162, 235, 1)',
                        borderWidth: 2,
                        tension: 0.4,
                        pointBackgroundColor: 'white',
                        pointBorderColor: 'rgba(54, 162, 235, 1)',
                        pointRadius: 5,
                        pointHoverRadius: 7
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            labels: {
                                font: {
                                    family: 'Poppins'
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                stepSize: 50
                            }
                        }
                    }
                }
            });
        });
    </script>

    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>

    <!-- WebSocket Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
    
    <!-- Auth Check - Must load first -->
    <script src="../../js/core/auth.js"></script>
    <script src="../../js/core/websocket.js"></script>
    <script src="../../js/admin/notifications.js"></script>

    <script src="../../js/user/simple-qr.js"></script>
    <script src="../../js/admin/dashboard.js"></script>
    <script src="../../js/user/qr-checkin.js"></script>
    <script src="../../js/admin/feedback.js" defer></script>
    <script src="../../js/user/suggest-events.js"></script>
    <script src="../../js/user/my-tickets.js"></script>
    <!-- my-events.js không tồn tại, đã xóa reference -->
</body>

</html>
</body>

</html>
