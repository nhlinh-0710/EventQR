spring.datasource.url=jdbc:mysql://localhost:3306/even_qr
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.web.resources.static-locations=file:uploads/,classpath:/static/

server.port=8080

# Giới hạn dung lượng tối đa cho file upload là 10MB
spring.servlet.multipart.max-file-size=10MB

# Giới hạn dung lượng tối đa cho toàn bộ request (bao gồm cả dữ liệu form) là 10MB
spring.servlet.multipart.max-request-size=10MB

# Thư mục lưu trữ file upload
# Có thể dùng đường dẫn tuyệt đối hoặc tương đối:
# - Đường dẫn tuyệt đối: C:/EventQR_Images (Windows) hoặc /home/user/EventQR_Images (Linux/Mac)
# - Đường dẫn tương đối: uploads/images/events (trong thư mục dự án)
# Ví dụ Windows: file.upload-dir=D:/MyImages/EventQR
# Ví dụ Linux/Mac: file.upload-dir=/var/www/uploads/events
file.upload-dir=uploads/images/events

